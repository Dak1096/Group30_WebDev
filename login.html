<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset ="UTF-8">
    <meta name ="viewport" content ="device = device-width,initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel ="stylesheet" href ="css/style.css">
</head>

<body>
  <h2>Student Login</h2>
  <form id ="LoginForm">
    <label for="username">Student account:</label><br> 
    <input type="text" id="username" name="username" required><br><br> <!-- Tạo ô để nhập acc username,
    required là bắt buộc nhập trc khi login -->
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br> <!--Tạo ô để nhập mk, bắt buộc nhập-->

    <input type="submit" value="Log in"> <!--Nút "login" để đăng nhập-->
    <p id ="LoginError"> </p> <!--Nếu như nhập mk sai thì sẽ tb lỗi ở js, nếu đúng thì ko hiện-->
  </form>
  <script type="module" src="js/auth.js"></script> <!-- Dựa theo file auth.js để xử lí logic đăng nhập-->
</body>
</html>
